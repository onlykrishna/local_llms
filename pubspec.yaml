name: flutter_ai_chat_app
description: "A production-grade AI Chat application with Phone Auth, AI Chat, and PDF RAG."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.2.0
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  firebase_app_check: ^0.3.1+3

  # UI & Phase 1
  flutter_dotenv: ^5.1.1
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.0.0
  intl: ^0.19.0

  # Phase 2 - AI Chat
  flutter_markdown: ^0.7.3
  http: ^1.2.2
  uuid: ^4.4.2

  # Phase 3 - PDF RAG
  syncfusion_flutter_pdf: ^33.2.6
  syncfusion_flutter_pdfviewer: ^33.2.6
  file_picker: ^8.1.2
  crypto: ^3.0.3
  path: ^1.9.0

  # Phase 4 - Polish
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1
  share_plus: ^10.0.0
  package_info_plus: ^8.0.2
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.0.5
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Phase 5 - Voice + Attachments + Offline LLM
  speech_to_text: ^7.0.0          # on-device STT (Android SpeechRecognizer / iOS Speech)
  flutter_tts: ^4.2.0             # on-device TTS for offline voice mode
  just_audio: ^0.9.40             # for MP3 playback of Google Cloud TTS

  permission_handler: ^11.3.1     # mic + camera + storage permissions
  image_picker: ^1.1.2            # camera + photo library for attachment menu
  dio: ^5.7.0                     # streamed GGUF model download with progress
  path_provider: ^2.1.4           # app support directory for GGUF model storage
  flutter_secure_storage: ^9.2.2  # secure storage for user-entered API keys
  fllama: ^0.0.1                  # Flutter binding for llama.cpp — on-device GGUF inference
  collection: ^1.19.1

  # Live Scan OCR & Object Detection
  camera: ^0.10.6
  google_mlkit_text_recognition: ^0.16.0
  tflite_flutter: ^0.12.1
  image: ^4.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

dependency_overrides:
  device_info_plus: 10.1.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/models/



